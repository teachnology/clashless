[project]
name = "clashless"
version = "0.1.0"
description = "Clash-free scheduling: assigns presentations to day/session slots without double-booking anyone"
readme = "README.md"
authors = [
    { name = "Marijan Beg", email = "m.beg@imperial.ac.uk" }
]
requires-python = ">=3.14"
dependencies = [
    "openpyxl>=3.1.5",
    "ortools>=9.15.6755",
    "pandas>=3.0.3",
    "plotly>=6.9.0",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fakeitmakeit>=2025.10.1",
    "ipykernel>=7.3.0",
    "kaleido>=1.3.0",
    "nbclient>=0.11.0",
    "nbval>=0.11.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.15.22",
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
